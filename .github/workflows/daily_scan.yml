name: Daily Full Universe Scan (S&P500 + Nasdaq100)

on:
  # 자동 스케줄 꺼짐 (2026-10-29 Harry 지시) — 수동 실행만 가능
  workflow_dispatch:          # "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 전체 유니버스 스캔은 시간이 좀 걸리므로 여유 있게 설정
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests pandas numpy yfinance lxml

      - name: Run full universe scan and send email
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 batch_scan.py
